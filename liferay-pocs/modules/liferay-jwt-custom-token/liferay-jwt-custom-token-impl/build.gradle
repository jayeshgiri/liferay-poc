dependencies {
	compile project(":modules:liferay-jwt-custom-token:liferay-jwt-custom-token-api")

	compileOnly group: "com.liferay.portal", name: "release.dxp.api"
	compileOnly group: "javax.annotation", name: "javax.annotation-api", version: "1.3.2"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations"

	restBuilder group: "com.liferay", name: "com.liferay.portal.tools.rest.builder", version: "1.0.222"

	compileInclude group: "com.google.code.gson", name: "gson", version: "2.8.6"
	compileInclude group: "com.nimbusds", name: "lang-tag", version: "1.4.4"
	compileInclude group: "com.nimbusds", name: "nimbus-jose-jwt", version: "7.7"
	compileInclude group: "com.nimbusds", name: "oauth2-oidc-sdk", version: "6.16.2"
}

group = "liferay.jwt.custom.token"